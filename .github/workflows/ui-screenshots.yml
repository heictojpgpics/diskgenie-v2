name: UI Screenshots

# The Windows screenshot workflow (owner instruction: "one for one
# page/mode/action"). Builds the REAL app (release, embedded frontend,
# ci-license-sim), stages a synthetic tree, launches with
# DISKGENIE_TOUR=1, and captures EXACTLY ONE NAMED FRAME PER TOUR STEP
# via the title-sync channel (the TourDriver stamps `tNN-name` into the
# window title; the harness polls it, lets the step settle, and shoots).
# The fixed-cadence capture remains only as a zero-artifact fallback.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build the app (release exe, no installer, ci-license-sim)
        # The license-sim feature (src-tauri/Cargo.toml [features]) is
        # ONLY compiled into this screenshots build: it seeds a
        # simulated activated license (DISKGENIE_LICENSE_SIM=1 below)
        # so the tour captures the working app AND — when the tour
        # flips it off — the Activation Gate + Pro status card. It does
        # not exist in NSIS/MSIX production builds.
        run: npx tauri build --no-bundle --features ci-license-sim
        env:
          CARGO_INCREMENTAL: 0

      - name: Stage a synthetic file tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\DiskGenieTest'
          New-Item -ItemType Directory -Force -Path `
            "$root\Users\dev\Desktop","$root\Users\dev\Documents\Work\Invoices 2026", `
            "$root\Users\dev\Downloads","$root\Users\dev\Pictures\Camera Roll","$root\Users\dev\Videos", `
            "$root\Users\dev\Projects\website-2026\node_modules\react","$root\Users\dev\Projects\scanner\target\debug", `
            "$root\Users\dev\AppData\Local\Temp","$root\Users\dev\AppData\Local\Google\Chrome\User Data\Default\Cache", `
            "$root\Program Files\Tools\Widget","$root\Windows\System32\drivers", `
            "$root\Program Files\Adobe\Adobe Photoshop 2027\Resources","$root\Program Files\Google\Chrome\Application", `
            "$root\Windows\WinSxS\amd64_microsoft-windows-sbscomponents_31bf3856ad364e35","$root\Windows\Installer", `
            "$root\ProgramData\Package Cache\{9f1e2d3a}","$root\Games\Starfield\Data","$root\Games\Steam\steamapps\common" | Out-Null
          # Big sparse files (instant on NTFS): media + VM images + pagefile-like.
          # Top-level branches are BALANCED so the by-folder pastel families
          # are all visible in treemap/sunburst screenshots (an unbalanced
          # tree rendered one 99% branch = monochrome). TOTAL <= ~15 GB —
          # the windows-latest runner has limited free disk; a larger set
          # exhausted C: and failed the staging step (run 35708696513).
          fsutil file createnew "$root\Users\dev\Videos\holiday-4k.mp4" 2684354560
          fsutil file createnew "$root\Users\dev\Videos\render-final.mp4" 1288490188
          fsutil file createnew "$root\Users\dev\Downloads\ubuntu-26.04.iso" 2147483648
          fsutil file createnew "$root\Users\dev\Downloads\backup-2026.qcow2" 1342177280
          fsutil file createnew "$root\Users\dev\Pictures\raw-shoot-001.cr3" 104857600
          fsutil file createnew "$root\Users\dev\Documents\annual-report.pdf" 47185920
          fsutil file createnew "$root\pagefile.sys" 1503238554
          fsutil file createnew "$root\hiberfil.sys" 805306368
          fsutil file createnew "$root\Program Files\Adobe\Adobe Photoshop 2027\Photoshop.exe" 1342177280
          fsutil file createnew "$root\Program Files\Adobe\Adobe Photoshop 2027\Resources\psresources.psr" 536870912
          fsutil file createnew "$root\Program Files\Google\Chrome\Application\chrome.exe" 805306368
          fsutil file createnew "$root\Windows\WinSxS\amd64_microsoft-windows-sbscomponents_31bf3856ad364e35\component.store" 1342177280
          fsutil file createnew "$root\Windows\Installer\a7f3c2e1.msi" 805306368
          fsutil file createnew "$root\ProgramData\Package Cache\{9f1e2d3a}\dotnet-runtime-10.0.4.exe" 805306368
          fsutil file createnew "$root\Games\Starfield\Data\Starfield.esm" 1342177280
          fsutil file createnew "$root\Games\Steam\steamapps\common\shadercache.bin" 805306368
          # Medium + small real files across categories
          1..30 | ForEach-Object {
            $bytes = New-Object byte[] (Get-Random -Minimum 4096 -Maximum 2097152)
            [System.IO.File]::WriteAllBytes("$root\Users\dev\Desktop\notes-$_\_.txt".Replace('\_',''), $bytes)
          }
          1..24 | ForEach-Object {
            $bytes = New-Object byte[] (Get-Random -Minimum 8192 -Maximum 8388608)
            [System.IO.File]::WriteAllBytes("$root\Users\dev\Projects\website-2026\node_modules\react\chunk-$_\.js".Replace('\.','.'), $bytes)
          }
          1..18 | ForEach-Object {
            $bytes = New-Object byte[] (Get-Random -Minimum 1024 -Maximum 1048576)
            [System.IO.File]::WriteAllBytes("$root\Users\dev\AppData\Local\Temp\tmp-$_\ .log".Replace('\ ','.log'), $bytes)
          }
          1..12 | ForEach-Object {
            $bytes = New-Object byte[] 262144
            [System.IO.File]::WriteAllBytes("$root\Users\dev\AppData\Local\Google\Chrome\User Data\Default\Cache\data_$_", $bytes)
          }
          1..10 | ForEach-Object {
            $bytes = New-Object byte[] (Get-Random -Minimum 65536 -Maximum 5242880)
            [System.IO.File]::WriteAllBytes("$root\Users\dev\Documents\Work\Invoices 2026\invoice-2026-$_\ .pdf".Replace('\ ','.pdf'), $bytes)
          }
          1..9 | ForEach-Object {
            $bytes = New-Object byte[] (Get-Random -Minimum 32768 -Maximum 2097152)
            [System.IO.File]::WriteAllBytes("$root\Users\dev\Pictures\Camera Roll\IMG_26$_\ .jpg".Replace('\ ','.jpg'), $bytes)
          }
          1..14 | ForEach-Object {
            $bytes = New-Object byte[] (Get-Random -Minimum 2048 -Maximum 1048576)
            [System.IO.File]::WriteAllBytes("$root\Program Files\Tools\Widget\tool-$_\ .dll".Replace('\ ','.dll'), $bytes)
          }
          1..8 | ForEach-Object {
            $bytes = New-Object byte[] 5242880
            [System.IO.File]::WriteAllBytes("$root\Windows\System32\drivers\driver-$_\ .sys".Replace('\ ','.sys'), $bytes)
          }
          1..7 | ForEach-Object {
            $bytes = New-Object byte[] (Get-Random -Minimum 4096 -Maximum 52428800)
            [System.IO.File]::WriteAllBytes("$root\Users\dev\Projects\scanner\target\debug\scanner-$_\ .exe".Replace('\ ','.exe'), $bytes)
          }
          Get-ChildItem -Recurse $root | Measure-Object | ForEach-Object { "staged $($_.Count) entries" }

      - name: Run the app + capture the tour (title-synced, one frame per step)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          # Bump the runner display to 1920x1080 so the capture shows the
          # COMPLETE app window (the default 1024x768 runner display used
          # to crop the right side of the 1280+ window — every historical
          # tour frame was missing the inspector). Non-fatal: fall back to
          # the default resolution if the cmdlet is unavailable.
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force | Out-Null
            "display set to 1920x1080"
          } catch {
            "display resolution change unavailable ($($_.Exception.Message)) — capturing at default"
          }
          $exe = Join-Path $PWD "src-tauri\target\release\diskgenie.exe"
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          $env:DISKGENIE_SCAN = 'C:\DiskGenieTest'
          $env:DISKGENIE_MODE = 'Folders'
          $env:DISKGENIE_TOUR = '1'
          $env:DISKGENIE_POSTHOG_KEY = ''
          $env:DISKGENIE_LICENSE_SIM = '1'
          $out = Join-Path $env:RUNNER_TEMP 'shots'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $app = Start-Process -FilePath $exe -WorkingDirectory $PWD -RedirectStandardOutput "$env:RUNNER_TEMP\app-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP\app-stderr.log" -PassThru
          # bring to front
          $ws = New-Object -ComObject WScript.Shell
          $null = $ws.AppActivate($app.Id)
          # Boot settle: WebView2 first paint + scan start (the ~15 GB
          # staged tree scans in ~3-4 s; the first title marker appears
          # with tour step 0 right after).
          Start-Sleep -Milliseconds 5500
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          function Shoot([string]$name) {
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save((Join-Path $out $name), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function WindowTitle() {
            # MainWindowTitle caches; Refresh() re-reads from Win32.
            $app.Refresh()
            return $app.MainWindowTitle
          }

          # ── TITLE-SYNCED capture: the TourDriver stamps each step into
          # the window title (`DiskGenie · tNN-name`); poll it and shoot
          # exactly ONE named frame per step — no duplicates, no misses,
          # "one for one page/mode/action".
          # DEDUP HARDENING: the previous loop keyed on the raw title
          # changing, so Windows decorating a busy window (" (Not
          # Responding)" appended) or a transient re-render re-matched the
          # step regex and re-shot the same page under near-identical
          # names — the duplicate-frames symptom. The loop now (1) parses
          # the marker with a strict slug charset that stops at any
          # decoration, and (2) keeps a captured-marker set so a step can
          # only ever be shot once, no matter how the title flickers.
          $deadline = (Get-Date).AddMinutes(12)
          $lastTitle = ''
          $frames = 0
          $sawMarker = $false
          $shot = New-Object 'System.Collections.Generic.HashSet[string]'
          while ((Get-Date) -lt $deadline -and -not $app.HasExited) {
            $t = WindowTitle
            if ($t -and $t -ne $lastTitle) {
              if ($t -match '· tour-done') { "tour finished after $frames frames"; break }
              if ($t -match '· (t\d{2}-[a-z0-9-]+)') {
                $marker = $Matches[1]
                if (-not $shot.Contains($marker)) {
                  # Settle: let the view-transition crossfade + the
                  # debounced canvas repaint land before the frame.
                  Start-Sleep -Milliseconds 1300
                  if ($app.HasExited) { break }
                  Shoot(($marker + '.png'))
                  $null = $shot.Add($marker)
                  $frames++
                  $sawMarker = $true
                  "captured $marker"
                }
              } elseif (-not $sawMarker) {
                # Pre-tour boot frame (the window before step 0); the
                # name is constant so boot-time title flicker overwrites
                # at most itself, never duplicates.
                Shoot('t00-boot.png'); $frames++
                "captured t00-boot (pre-tour)"
              }
              $lastTitle = $t
            }
            Start-Sleep -Milliseconds 250
          }

          # ── FALLBACK: no title markers (tour env missing / title sync
          # broken) — the old cadence capture so the run never yields
          # zero artifacts.
          if (-not $sawMarker) {
            "no tour title markers — falling back to cadence capture"
            $step = 0
            while ($step -lt 48 -and -not $app.HasExited) {
              Start-Sleep -Milliseconds 2600
              Shoot(('step-{0:d2}.png' -f $step))
              $step++
            }
          }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Start-Sleep -Milliseconds 500
          # Rust panics + tracing land in stderr; the webview console is
          # not reachable from the harness — these logs make the next
          # hang/blank diagnosis a download instead of a guess.
          if (Test-Path "$env:RUNNER_TEMP\app-stderr.log") {
            "--- app-stderr tail ---"
            Get-Content "$env:RUNNER_TEMP\app-stderr.log" -Tail 40
          }
          Get-ChildItem $out | ForEach-Object { "captured $($_.Name)" }

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: diskgenie-ui-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 14
          if-no-files-found: error

      - name: Upload app logs
        uses: actions/upload-artifact@v4
        with:
          name: diskgenie-app-logs
          path: |
            ${{ runner.temp }}/app-stdout.log
            ${{ runner.temp }}/app-stderr.log
          retention-days: 14
          if-no-files-found: warn
